<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="vmup — secure cloud data science environments, from your terminal">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161028"/>
      <stop offset="55%" stop-color="#221a38"/>
      <stop offset="100%" stop-color="#2c1f42"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b53694" stop-opacity="0"/>
      <stop offset="100%" stop-color="#b53694" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="rocket" gradientUnits="userSpaceOnUse" x1="60" y1="14" x2="60" y2="128">
      <stop offset="0%" stop-color="#8a8ae0"/>
      <stop offset="100%" stop-color="#b53694"/>
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb8e6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#8a8ae0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8a8ae0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9a0f0"/>
      <stop offset="100%" stop-color="#e06bbf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8a8ae0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8a8ae0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect y="620" width="1600" height="280" fill="url(#horizon)"/>

  <g fill="#cfd0ff">
    <circle cx="120" cy="90" r="1.8" opacity="0.7"/><circle cx="250" cy="170" r="1.2" opacity="0.45"/>
    <circle cx="395" cy="65" r="2.2" opacity="0.8"/><circle cx="540" cy="135" r="1.3" opacity="0.5"/>
    <circle cx="690" cy="55" r="1.6" opacity="0.65"/><circle cx="800" cy="180" r="1.1" opacity="0.4"/>
    <circle cx="950" cy="80" r="1.9" opacity="0.75"/><circle cx="1080" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="1390" cy="70" r="1.5" opacity="0.6"/><circle cx="1500" cy="145" r="2.0" opacity="0.8"/>
    <circle cx="90" cy="330" r="1.4" opacity="0.5"/><circle cx="215" cy="470" r="1.7" opacity="0.55"/>
    <circle cx="1545" cy="300" r="1.3" opacity="0.5"/><circle cx="1455" cy="405" r="1.6" opacity="0.6"/>
    <circle cx="145" cy="700" r="1.5" opacity="0.5"/><circle cx="1520" cy="760" r="1.4" opacity="0.55"/>
    <circle cx="640" cy="820" r="1.2" opacity="0.4"/><circle cx="1210" cy="855" r="1.3" opacity="0.45"/>
  </g>

  <ellipse cx="1250" cy="235" rx="300" ry="215" fill="url(#glow)"/>
  <polygon points="1150,310 1176,336 1020,486 990,458" fill="url(#trail)"/>
  <g fill="#5cb8e6">
    <circle cx="1078" cy="400" r="4" opacity="0.7"/><circle cx="1046" cy="434" r="2.8" opacity="0.5"/>
  </g>
  <g transform="translate(1258,232) rotate(45) scale(2.4) translate(-60,-71)">
    <polygon points="60,14 40,46 80,46" fill="url(#rocket)"/>
    <polygon points="40,48 40,90 60,90" fill="url(#rocket)"/>
    <polygon points="80,48 80,90 60,90" fill="url(#rocket)"/>
    <polygon points="50,98 70,98 60,128" fill="url(#rocket)"/>
  </g>

  <g>
    <text x="120" y="210" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="26" letter-spacing="9" fill="#8a8ae0">VINDHYA DATA SCIENCE</text>
    <text x="110" y="378" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-weight="700" font-size="170" fill="url(#wordmark)">vmup</text>
    <text x="120" y="450" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" fill="#dcd9ea">Secure cloud data science environments,</text>
    <text x="120" y="502" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="40" fill="#dcd9ea">from your terminal.</text>
    <text x="120" y="558" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="23" fill="#9a94b8">powered by Terraform · secured by IAP · inspired by Claude Code</text>
  </g>

  <g>
    <rect x="118" y="618" width="1364" height="222" rx="14" fill="#262633" stroke="#3a3a4a" stroke-width="2"/>
    <rect x="118" y="618" width="1364" height="40" rx="14" fill="#2f2f3e"/>
    <rect x="118" y="642" width="1364" height="16" fill="#2f2f3e"/>
    <circle cx="146" cy="638" r="6.5" fill="#8a8ae0" opacity="0.9"/>
    <circle cx="169" cy="638" r="6.5" fill="#6f6fd6" opacity="0.7"/>
    <circle cx="192" cy="638" r="6.5" fill="#5cb8e6" opacity="0.7"/>
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="21">
      <text x="146" y="700" fill="#5ec98e">$ vmup</text>
      <text x="146" y="734" fill="#e0a458">◐ Launching rstudio-demo <tspan fill="#8d8aa0">(~$0.12/hr)</tspan></text>
      <text x="146" y="768" fill="#8d8aa0">vpc <tspan fill="#5ec98e">✓</tspan> · nat <tspan fill="#5ec98e">✓</tspan> · iap-only firewall <tspan fill="#5ec98e">✓</tspan></text>
      <text x="146" y="806" fill="#5cb8e6"><tspan fill="#5ec98e">✓</tspan> tunnel → http://localhost:8787</text>
    </g>
  </g>
</svg>
